name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: openclaw-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Audit production dependencies (HIGH/CRITICAL)
        # Yarn Classic's audit endpoint was retired upstream (HTTP 410). npm audit
        # evaluates the installed production graph without adding package-lock.json.
        run: npm audit --omit=dev --audit-level=high --package-lock=false

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector test dependencies
        run: python3 -m pip install pytest

      - name: Run collector tests
        run: python3 -m pytest tests/collector -q

      - name: Build production bundle
        run: yarn build

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run browser tests
        run: CI=1 yarn test
        env:
          DASHBOARD_AUTH_USER: ${{ secrets.DASHBOARD_AUTH_USER }}
          DASHBOARD_AUTH_PASSWORD: ${{ secrets.DASHBOARD_AUTH_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_COOKIE_SECURE: "false"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  sonarqube:
    name: SonarQube quality gate
    needs: validate
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SonarQube configuration
        id: sonar
        run: |
          if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube scan skipped because SONAR_HOST_URL and SONAR_TOKEN are not configured for this repository."
          fi

      - name: Scan and wait for the quality gate
        if: steps.sonar.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  docker-publish:
    name: Build and publish Docker image
    needs: [validate, sonarqube]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/openclaw-observability-dashboard
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openclaw-dashboard-image
          cache-to: type=gha,mode=max,scope=openclaw-dashboard-image

      - name: Scan published image for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/openclaw-observability-dashboard:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  deploy:
    name: Deploy dashboard service
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.next' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='.env*' \
            --exclude='*.log' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            -e ssh \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/openclaw-observability-dashboard/

      - name: Install dependencies, build and restart services
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<'REMOTE'
            set -euo pipefail
            cd /home/ubuntu/openclaw-observability-dashboard
            [ -f .env ] || cp .env.example .env
            pkill -f 'next build' || true
            rm -f .next/build.lock
            yarn install --frozen-lockfile
            yarn build
            systemctl --user daemon-reload
            systemctl --user restart openclaw-observability-dashboard.service
            systemctl --user restart openclaw-observability-collector.timer
            systemctl --user restart openclaw-observability-collector.service
          REMOTE
