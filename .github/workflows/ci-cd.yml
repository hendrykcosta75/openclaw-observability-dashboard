name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test deps
        run: pip install pytest

      - name: Run collector tests
        run: python3 -m pytest tests/collector -q

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run E2E tests
        run: CI=1 yarn test
        env:
          DASHBOARD_AUTH_USER: ${{ secrets.DASHBOARD_AUTH_USER }}
          DASHBOARD_AUTH_PASSWORD: ${{ secrets.DASHBOARD_AUTH_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_COOKIE_SECURE: 'false'

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.next' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='.env*' \
            --exclude='*.log' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            -e ssh \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/openclaw-observability-dashboard/

      - name: Install deps and build on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<'REMOTE'
            set -e
            cd /home/ubuntu/openclaw-observability-dashboard
            # Ensure env file exists on server (not overwritten by rsync)
            [ -f .env ] || cp .env.example .env
            yarn install --frozen-lockfile
            yarn build
            # Restart services
            sudo systemctl restart openclaw-observability-dashboard.service
            sudo systemctl restart openclaw-observability-collector.timer
            sudo systemctl restart openclaw-observability-collector.service
          REMOTE
